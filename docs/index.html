<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Post Voting Tool</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>Post Voting Tool</h1>

      <section class="panel">
        <label for="apiUrl">API URL</label>
        <input id="apiUrl" placeholder="https://your-api.example.com" />
        <button id="saveApiUrl">Save API URL</button>
      </section>

      <section class="panel">
        <h2>New Post</h2>
        <form id="postForm">
          <textarea id="postText" rows="4" maxlength="500" placeholder="Write your post..."></textarea>
          <button type="submit">Post</button>
        </form>
      </section>

      <section class="panel">
        <h2>Posts</h2>
        <button id="refreshBtn">Refresh</button>
        <ul id="posts"></ul>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
